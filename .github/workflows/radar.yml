name: Signal-Radar

# Collects all sources every 15 minutes and publishes the site to GitHub Pages.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start a few minutes late)
  workflow_dispatch:          # "Run workflow" button for an immediate refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only for the daily history archive in branch "data"
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: node --test test/lib.test.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect data
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}/
          # Optional: repo secret ANTHROPIC_API_KEY → Claude writes the briefing every 6 hours.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Higher rate limit for the GitHub trend search (provided automatically)
          GITHUB_TOKEN: ${{ github.token }}
          # The SEC requires a contact string. Optional secret SEC_USER_AGENT = "Name mail@example.com"
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('SignalRadar dashboard {0}/{1}', github.server_url, github.repository) }}
          HISTORY_FALLBACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/history.json
        run: node collector/collect.mjs
      - name: Archive history (daily, branch "data")
        if: github.ref == 'refs/heads/main'
        run: |
          now=$(date -u +%H%M)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [ "$now" \< "2200" ] || [ ! "$now" \< "2215" ]; }; then echo "Not 22:00-22:15 UTC, skipped"; exit 0; fi
          git config --global user.name "signal-radar-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "$REMOTE" /tmp/data-branch
          else
            mkdir -p /tmp/data-branch && git -C /tmp/data-branch init -q -b data && git -C /tmp/data-branch remote add origin "$REMOTE"
          fi
          cp "$GITHUB_WORKSPACE/site/data/history.json" /tmp/data-branch/history.json
          cd /tmp/data-branch && git add history.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "History $(date -u +%F)" && git push -q origin data
      - name: Absolute preview image URL for WhatsApp
        run: sed -i "s|content=\"og.png\"|content=\"${{ steps.pages.outputs.base_url }}/og.png\"|" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1   # frequent runs must not fill the account's artifact storage

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
