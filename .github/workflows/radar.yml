name: Signal-Radar

# Sammelt stündlich alle Quellen und veröffentlicht die Seite auf GitHub Pages.
on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub kann sich um ein paar Minuten verspäten)
  workflow_dispatch:          # „Run workflow“-Knopf für sofortiges Aktualisieren
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # nur für die tägliche Verlaufs-Sicherung im Zweig "data"
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: node --test test/lib.test.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - name: Daten sammeln
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}/
          # Optional: Repo-Secret ANTHROPIC_API_KEY anlegen → Claude schreibt alle 6 Stunden den Lagebericht.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Höheres Abruf-Limit für die GitHub-Trend-Suche (automatisch vorhanden, nur Leserechte)
          GITHUB_TOKEN: ${{ github.token }}
          # Die US-Börsenaufsicht verlangt einen Absender. Optional: Secret SEC_USER_AGENT = "Name deine@mail.de"
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('SignalRadar dashboard {0}/{1}', github.server_url, github.repository) }}
          HISTORY_FALLBACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/history.json
        run: node collector/collect.mjs
      - name: Verlauf dauerhaft sichern (einmal täglich, Zweig "data")
        if: github.ref == 'refs/heads/main'
        run: |
          now=$(date -u +%H%M)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [ "$now" \< "2200" ] || [ ! "$now" \< "2215" ]; }; then echo "Nicht 22:00–22:15 UTC, übersprungen"; exit 0; fi
          git config --global user.name "signal-radar-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "$REMOTE" /tmp/data-branch
          else
            mkdir -p /tmp/data-branch && git -C /tmp/data-branch init -q -b data && git -C /tmp/data-branch remote add origin "$REMOTE"
          fi
          cp "$GITHUB_WORKSPACE/site/data/history.json" /tmp/data-branch/history.json
          cd /tmp/data-branch && git add history.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -q -m "Verlauf $(date -u +%F)" && git push -q origin data
      - name: Absolute Vorschaubild-URL für WhatsApp
        run: sed -i "s|content=\"og.png\"|content=\"${{ steps.pages.outputs.base_url }}/og.png\"|" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1   # stündliche Läufe sollen den Artefakt-Speicher des Kontos nicht füllen

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
